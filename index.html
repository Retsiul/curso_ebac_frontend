<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width , initial-scale=1.0">
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>
<style>
    .container {
        max-width: 800px;
        margin-top: 100px;
        border-radius: 10px;
        padding: 20px;
        background: linear-gradient(45deg, rgb(134, 255, 255), rgb(2, 255, 255));
    }

    button {
        margin-top: 10px;
    }
</style>

<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h2>Faça seu cadastro</h2>
                <form>
                    <label class="form-label" for="nome">Digite seu nome:</label>
                    <input required class="form-control" type="text" id="nome">

                    <label class="form-label" for="email">Digite seu e-mail:</label>
                    <input required class="form-control" type="email" id="email">


                    <label class="form-label" for="numero">Digite seu número:</label>
                    <input required class="form-control" type="tel" id="numero">

                    <button class="btn btn-success">Enviar</button>

                </form>
            </div>
        </div>
    </div>

</body>

</html>
